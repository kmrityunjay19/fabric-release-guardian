trigger:
  branches:
    include: [main]

stages:
- stage: Validate
  jobs:
  - job: ReleaseReadiness
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - script: |
        python src/release_guardian.py \
          --manifest sample_data/release_manifest.json \
          --environment sample_data/prod_environment.json \
          --output release_readiness.md
      displayName: Validate Fabric release readiness
    - publish: release_readiness.md
      artifact: release-readiness

- stage: Deploy
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - deployment: DeployToProduction
    environment: fabric-production
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Invoke the approved Fabric deployment task or fabric-cicd here."
